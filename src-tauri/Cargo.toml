[package]
name = "squidcode"
version = "0.1.0"
description = "Lightweight personal code viewer/editor with first-class Markdown editing"
edition = "2024"

[lib]
# `_lib` suffix keeps the lib name distinct from the bin name (Windows cargo issue #8519).
name = "squidcode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.7.2"
getrandom = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_IO"] }
